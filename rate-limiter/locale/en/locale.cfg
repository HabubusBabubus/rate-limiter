[mod-name]
rate-limiter=Rate Limiter

[mod-description]
rate-limiter=Slow down any machine that produces something: 0–100% in the machine window, with a selection tool or from the circuit network. Output, input, power and pollution scale together.

[item-name]
rl-selection-tool=Rate limiter tool

[shortcut-name]
rl-shortcut=Rate limiter tool

[controls]
rl-get-tool=Rate Limiter: take the selection tool

[mod-setting-name]
rl-duty-cycle-ticks=Pulse cycle length (ticks)
rl-refresh-ticks=Re-check interval (ticks)
rl-circuit-ticks=Circuit network read interval (ticks)
rl-alt-labels=Show the limit in Alt mode

[mod-setting-description]
rl-duty-cycle-ticks=Machines that cannot be slowed smoothly (boilers, generators, reactors, pumps, and any machine below 20% of its speed) work in pulses: on for part of each cycle. Shorter cycles are smoother but switch machines more often. 60 ticks = 1 second.
rl-refresh-ticks=How often limited machines are re-checked, so that changes of modules and beacons are taken into account.
rl-circuit-ticks=How often the signal is read for machines controlled by the circuit network.
rl-alt-labels=An icon and the percentage on limited machines and ghosts, visible in Alt mode.

