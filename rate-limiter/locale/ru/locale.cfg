[mod-name]
rate-limiter=Rate Limiter

[mod-description]
rate-limiter=Замедляет любую машину, которая что-то производит: 0–100% в окне машины, инструментом выделения или из логической сети. Выпуск, потребление, энергия и загрязнение меняются вместе.

[item-name]
rl-selection-tool=Инструмент ограничения скорости

[shortcut-name]
rl-shortcut=Инструмент ограничения скорости

[controls]
rl-get-tool=Rate Limiter: взять инструмент выделения

[mod-setting-name]
rl-duty-cycle-ticks=Длина цикла импульсов (тики)
rl-refresh-ticks=Интервал перепроверки (тики)
rl-circuit-ticks=Интервал чтения логической сети (тики)
rl-alt-labels=Показывать ограничение в Alt-режиме

[mod-setting-description]
rl-duty-cycle-ticks=Машины, которые нельзя замедлить плавно (котлы, генераторы, реакторы, насосы, а также любая машина ниже 20% своей скорости), работают импульсами: включены часть каждого цикла. Короткий цикл ровнее, но чаще переключает машины. 60 тиков = 1 секунда.
rl-refresh-ticks=Как часто перепроверяются ограниченные машины, чтобы учесть смену модулей и маяков.
rl-circuit-ticks=Как часто читается сигнал у машин, управляемых логической сетью.
rl-alt-labels=Значок и процент над ограниченными машинами и призраками, видны в Alt-режиме.

